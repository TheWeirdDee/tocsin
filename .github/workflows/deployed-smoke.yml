name: Deployed smoke

# Read-only checks of the live deployment after Vercel reports a successful production
# deployment (or on demand). It does not deploy anything and sends no load: a few dozen
# ordinary requests plus one browser pass.
#
# Jobs are independent so one failure does not hide the others: once both services serve the
# expected commit, deployment checks, the 12 audit findings, rate-limit identity and the browser
# suite all run. The final "release gate" job fails if any of them failed.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_URL: https://tocsin-phi.vercel.app
  API_URL: https://tocsin-production.up.railway.app

jobs:
  versions:
    name: Frontend and API serve the deployed commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for both services, then compare commit, config and artifacts
        env:
          EXPECTED: ${{ github.event.deployment.sha || github.sha }}
        run: |
          set -eu
          web=$(curl -fsS "$WEB_URL/version.json" | python3 -c "import json,sys;print(json.load(sys.stdin)['commit'])")
          echo "frontend commit: $web (expected $EXPECTED)"
          test "$web" = "$EXPECTED"
          # Railway builds the same push independently; wait up to 10 minutes for it.
          for i in $(seq 1 40); do
            v=$(curl -fsS "$API_URL/api/version" || echo '{}')
            api=$(echo "$v" | python3 -c "import json,sys;print(json.load(sys.stdin).get('build_commit'))")
            echo "API commit: $api"
            if [ "$api" = "$EXPECTED" ]; then
              echo "$v"
              echo "$v" | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['consistent'] and v['config_sha']==v['artifact_config_sha'], 'config and artifact bundle disagree'"
              exit 0
            fi
            sleep 15
          done
          echo "API did not reach the deployed commit"; exit 1

  deployment-checks:
    name: Deployment checks (health, artifacts, CORS, uploads, direct routes)
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - run: python3 scripts/verify_deployment.py --api "$API_URL" --web "$WEB_URL" --label "actions-${{ github.run_id }}"

  identity:
    name: Rate-limit identity (TC-11)
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Expected behaviour: the API identifies this runner by its real public address (taken from
      # the X-Real-IP header Railway's edge sets), and caller-supplied X-Real-IP / X-Forwarded-For
      # values cannot change that identity. Only hashes are printed.
      - name: Identity is the caller's real address and cannot be spoofed
        run: |
          set -eu
          me=$(curl -fsS https://api.ipify.org | tr -d '\n' | sha256sum | cut -c1-12)
          echo "runner address hash: $me"
          cid() { curl -fsS "$@" "$API_URL/api/client-id"; echo; }
          { cid; cid -H "X-Forwarded-For: 203.0.113.7"; cid -H "X-Real-IP: 203.0.113.8";
            cid -H "X-Real-IP: 203.0.113.9" -H "X-Forwarded-For: 198.51.100.9, 192.0.2.1"; } > ids.jsonl
          cat ids.jsonl
          EXPECT="$me" python3 -c "
          import json, os
          ids = [json.loads(l) for l in open('ids.jsonl') if l.strip()]
          assert all(i['source'] == 'header' for i in ids), 'identity not taken from the edge header'
          assert {i['client_hash'] for i in ids} == {os.environ['EXPECT']}, 'identity is not this runner, or spoofing changed it'
          print('identity = runner address; spoofed headers ignored')"

  audit:
    name: Audit findings TC-01 to TC-12
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Reproduce the browser findings
        working-directory: web
        run: node e2e/audit_repro.mjs "$WEB_URL" ../results/audit/reproduction-deployed.json "$API_URL"
      - name: Judge all 12 findings
        run: |
          me=$(curl -fsS https://api.ipify.org | tr -d '\n' | sha256sum | cut -c1-12)
          python3 scripts/check_audit_deployed.py --api "$API_URL" --web "$WEB_URL" \
            --repro results/audit/reproduction-deployed.json --expect-ip-sha "$me"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-deployed
          path: results/audit/

  browser:
    name: Browser suite against the live deployment (desktop and phone)
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: web
        env:
          E2E_BASE_URL: ${{ env.WEB_URL }}
          E2E_API_BASE: ${{ env.API_URL }}
        run: npx playwright test --project=desktop --project=phone
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            results/e2e-deployed.json
            web/test-results/

  release-gate:
    name: Release gate (all required checks)
    needs: [versions, deployment-checks, identity, audit, browser]
    if: always() && needs.versions.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          for name, r in needs.items(): print(f'{name}: {r[\"result\"]}')
          bad = [n for n, r in needs.items() if r['result'] != 'success']
          sys.exit(f'not released: {bad}' if bad else 0)"
